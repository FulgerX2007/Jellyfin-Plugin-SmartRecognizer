name: Build

# Every push and pull request: run the tests and build the plugin zip (kept as a workflow artifact).
# A tag like v0.2.0 also publishes a GitHub Release with the zip attached.
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Test
        run: dotnet test -c Release

      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Install jprm
        run: pip install jprm

      # Tag v0.2.0 → plugin version 0.2.0.0; other builds keep the version from build.yaml.
      - name: Version
        id: version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            version="${GITHUB_REF_NAME#v}"
            while [[ "$(tr -cd '.' <<< "$version" | wc -c)" -lt 3 ]]; do version="$version.0"; done
          else
            version="$(sed -n 's/^version: *"\(.*\)"/\1/p' build.yaml)"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Plugin version: $version"

      - name: Build plugin zip
        run: |
          mkdir -p artifacts
          jprm --verbosity=info plugin build . --output=artifacts --version="${{ steps.version.outputs.version }}"

      # The server provides Jellyfin.* and Microsoft.* assemblies; shipping them breaks plugin loading.
      - name: Check zip contents
        run: |
          zip="$(ls artifacts/*.zip)"
          unzip -l "$zip"
          extra="$(unzip -Z1 "$zip" | grep -v -x -e 'Jellyfin.Plugin.SmartRecognizer.dll' -e 'meta.json' || true)"
          if [[ -n "$extra" ]]; then
            echo "::error::Unexpected files in the plugin zip: $extra"
            exit 1
          fi

      - uses: actions/upload-artifact@v7
        with:
          name: smart-recognizer-${{ steps.version.outputs.version }}
          path: artifacts/
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: smart-recognizer-${{ needs.build.outputs.version }}
          path: artifacts

      - uses: softprops/action-gh-release@v3
        with:
          files: |
            artifacts/*.zip
            artifacts/*.md5sum
          generate_release_notes: true
